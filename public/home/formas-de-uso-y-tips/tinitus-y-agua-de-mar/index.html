    <script>
        function leerPagina() {

    <!-- Cargamos Fuse.js (compatible con el formato fuse_json de Zola) -->
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2/dist/fuse.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('search-input');
            const results = document.getElementById('search-results');
            
            // Cargamos el índice JSON que Zola generó exitosamente
            fetch('/search_index.es.json')
                .then(response => response.json())
                .then(data => {
                    console.log('✅ Índice de búsqueda cargado correctamente con Fuse.js');
                    
                    const fuse = new Fuse(data, {
                        keys: ['title', 'body'],
                        threshold: 0.3,
                        includeScore: true
                    });
                    
                    function performSearch() {
                        const query = input.value.trim();
                        if (query.length < 2) {
                            results.style.display = 'none';
                            return;
                        }
                        
                        const searchResults = fuse.search(query);
                        
                        if (searchResults.length > 0) {
                            results.innerHTML = searchResults.slice(0, 10).map(result => {
                                const doc = result.item;
                                return `<div class="search-result"><a href="${doc.url}">${doc.title}</a></div>`;
                            }).join('');
                            results.style.display = 'block';
                        } else {
                            results.innerHTML = '<div class="search-result" style="color: #666;">No se encontraron resultados</div>';
                            results.style.display = 'block';
                        }
                    }

                    input.addEventListener('input', performSearch);
                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') {
                            performSearch();
                            input.blur();
                        }
                    });

                    document.addEventListener('click', (e) => {
                        if (!e.target.closest('.search-box')) {
                            results.style.display = 'none';
                        }
                    });
                })
                .catch(err => {
                    console.error('Error cargando índice de búsqueda:', err);
                    input.placeholder = "⚠️ Búsqueda no disponible";
                });
        });
    </script>
