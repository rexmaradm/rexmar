<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>prueba a ver - Rexmar</title>
    <style>
        body { background-color: #1e3a8a; color: #ffffff; font-family: Arial, sans-serif; margin: 0; padding: 0; line-height: 1.6; }
        header { background-color: #1e40af; padding: 20px; text-align: center; border-bottom: 3px solid #3b82f6; }
        header h1 a { color: #ffffff; text-decoration: none; font-size: 2em; }
        nav { margin: 20px 0; display: flex; justify-content: center; flex-wrap: wrap; }
        nav a { color: #ffffff; text-decoration: none; margin: 5px 10px; padding: 8px 15px; background-color: #2563eb; border-radius: 5px; }
        nav a:hover { background-color: #3b82f6; }
        main { max-width: 1200px; margin: 40px auto; padding: 20px; background-color: #1e40af; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        a { color: #93c5fd; }
        .home-content { margin-bottom: 40px; border-bottom: 1px solid #3b82f6; padding-bottom: 20px; }
        .article-list { margin-top: 40px; }
        .article-list h2 { border-bottom: 2px solid #3b82f6; padding-bottom: 10px; color: #bfdbfe; }
        article.preview { margin-bottom: 15px; padding: 15px; background-color: #2563eb; border-radius: 8px; }
        article.preview h3 { margin: 0 0 5px 0; }
        article.preview a { color: #ffffff; text-decoration: none; }
        article.preview a:hover { text-decoration: underline; }
        footer { text-align: center; padding: 20px; color: #93c5fd; margin-top: 40px; }
        
        /* Estilos para búsqueda y audio */
        .tools-container { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 15px; margin: 20px 0; padding: 15px; background-color: #2563eb; border-radius: 8px; }
        .search-box { position: relative; max-width: 400px; }
        #search-input { width: 100%; padding: 10px; border: 2px solid #3b82f6; border-radius: 5px; background-color: #ffffff; color: #1e3a8a; font-size: 16px; box-sizing: border-box; }
        #search-results { position: absolute; top: 100%; left: 0; right: 0; background-color: #ffffff; border: 2px solid #3b82f6; border-radius: 5px; max-height: 300px; overflow-y: auto; z-index: 100; display: none; margin-top: 5px; }
        .search-result { padding: 10px; border-bottom: 1px solid #e5e7eb; }
        .search-result a { color: #1e3a8a; text-decoration: none; display: block; }
        .search-result a:hover { background-color: #f3f4f6; }
        .audio-btn { padding: 10px 20px; background-color: #1e40af; color: #ffffff; border: 2px solid #3b82f6; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .audio-btn:hover { background-color: #3b82f6; }
    </style>
</head>
<body>
    <header>
        <h1><a href="/">Rexmar</a></h1>
        <nav>
            
                <a href="&#x2F;">Inicio</a>
            
                <a href="&#x2F;formas-de-uso-y-tips&#x2F;">Formas de Uso</a>
            
                <a href="&#x2F;recetas&#x2F;">Recetas</a>
            
                <a href="&#x2F;preguntas-frecuentes&#x2F;">Preguntas Frecuentes</a>
            
                <a href="&#x2F;rexcobre-artesanias&#x2F;">Rexcobre</a>
            
                <a href="&#x2F;contacto&#x2F;">Contacto</a>
            
        </nav>
        
        <!-- Contenedor de herramientas: Búsqueda + Audio -->
        <div class="tools-container">
            <!-- Campo de búsqueda -->
            <div class="search-box">
                <input type="text" id="search-input" placeholder=" Buscar en el sitio...">
                <div id="search-results"></div>
            </div>
            
            <!-- Botón ResponsiveVoice -->
            <button class="audio-btn" onclick="leerPagina()">🔊 Escuchar página</button>
        </div>
    </header>
    
    <main>
        
<article>
    <h1>prueba a ver</h1>
    <time>2023-10-11</time>
    <div class="content">
        <p>pprueba a ver donde escribe</p>

    </div>
</article>

    </main>
    
    <footer>
        <p>&copy; Rexmar - Todos los derechos reservados.</p>
    </footer>

    <!-- Script de ResponsiveVoice -->
    <script src="https://code.responsivevoice.org/responsivevoice.js"></script>
    <script>
        function leerPagina() {
            var texto = document.querySelector('main').innerText;
            responsiveVoice.speak(texto, "Spanish Latin American Female", {
                rate: 1,
                pitch: 1,
                volume: 1
            });
        }
    </script>

    <!-- Script de búsqueda de Zola (solo si está activada) -->
    
    <script src="/elasticlunr.min.js"></script>
    <script>
        // Detectar idioma y cargar el índice correcto
        var searchIndexUrl = '/search_index.es.js'; // Por defecto inglés
        
        fetch(searchIndexUrl)
            .then(response => {
                if (!response.ok) {
                    // Si no existe el índice en inglés, probar con español
                    return fetch('/search_index.es.js');
                }
                return response;
            })
            .then(response => response.json())
            .then(data => {
                const index = elasticlunr.Index.load(data);
                const input = document.getElementById('search-input');
                const results = document.getElementById('search-results');
                
                input.addEventListener('input', () => {
                    const query = input.value.trim();
                    if (query.length < 2) {
                        results.style.display = 'none';
                        return;
                    }
                    
                    const searchResults = index.search(query, { 
                        fields: { title: { boost: 2 }, body: { boost: 1 } }, 
                        expand: true 
                    });
                    
                    if (searchResults.length > 0) {
                        results.innerHTML = searchResults.map(result => {
                            const doc = data.docs[result.ref];
                            return `<div class="search-result"><a href="${doc.url}">${doc.title}</a></div>`;
                        }).join('');
                        results.style.display = 'block';
                    } else {
                        results.innerHTML = '<div class="search-result" style="color: #666;">No se encontraron resultados</div>';
                        results.style.display = 'block';
                    }
                });

                // Ocultar resultados al hacer clic fuera
                document.addEventListener('click', (e) => {
                    if (!e.target.closest('.search-box')) {
                        results.style.display = 'none';
                    }
                });
            })
            .catch(err => {
                console.error("Error cargando índice de búsqueda:", err);
                document.getElementById('search-input').placeholder = "🔍 Búsqueda no disponible";
            });
    </script>
    
</body>
</html>
