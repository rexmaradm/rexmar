<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <style>
        body { background-color: #1e3a8a; color: #ffffff; font-family: Arial, sans-serif; margin: 0; padding: 0; line-height: 1.6; }
        header { background-color: #1e40af; padding: 20px; text-align: center; border-bottom: 3px solid #3b82f6; }
        header h1 a { color: #ffffff; text-decoration: none; font-size: 2em; }
        nav { margin: 20px 0; display: flex; justify-content: center; flex-wrap: wrap; }
        nav a { color: #ffffff; text-decoration: none; margin: 5px 10px; padding: 8px 15px; background-color: #2563eb; border-radius: 5px; }
        nav a:hover { background-color: #3b82f6; }
        main { max-width: 1200px; margin: 40px auto; padding: 20px; background-color: #1e40af; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        a { color: #93c5fd; }
        .home-content { margin-bottom: 40px; border-bottom: 1px solid #3b82f6; padding-bottom: 20px; }
        .article-list { margin-top: 40px; }
        .article-list h2 { border-bottom: 2px solid #3b82f6; padding-bottom: 10px; color: #bfdbfe; }
        article.preview { margin-bottom: 15px; padding: 15px; background-color: #2563eb; border-radius: 8px; }
        article.preview h3 { margin: 0 0 5px 0; }
        article.preview a { color: #ffffff; text-decoration: none; }
        article.preview a:hover { text-decoration: underline; }
        footer { text-align: center; padding: 20px; color: #93c5fd; margin-top: 40px; }
        
        .tools-container { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 15px; margin: 20px 0; padding: 15px; background-color: #2563eb; border-radius: 8px; }
        .search-box { position: relative; width: 100%; max-width: 400px; }
        #search-input { width: 100%; padding: 10px 15px; border: 2px solid #3b82f6; border-radius: 25px; background-color: #ffffff; color: #1e3a8a; font-size: 16px; box-sizing: border-box; outline: none; }
        #search-input:focus { border-color: #60a5fa; box-shadow: 0 0 8px rgba(59, 130, 246, 0.5); }
        #search-results { position: absolute; top: 100%; left: 0; right: 0; background-color: #ffffff; border: 2px solid #3b82f6; border-radius: 8px; max-height: 300px; overflow-y: auto; z-index: 100; display: none; margin-top: 5px; }
        .search-result { padding: 10px 15px; border-bottom: 1px solid #e5e7eb; }
        .search-result:last-child { border-bottom: none; }
        .search-result a { color: #1e3a8a; text-decoration: none; display: block; font-weight: bold; }
        .search-result a:hover { background-color: #f3f4f6; }
        .audio-btn { padding: 10px 20px; background-color: #1e40af; color: #ffffff; border: 2px solid #3b82f6; border-radius: 25px; cursor: pointer; font-size: 16px; font-weight: bold; white-space: nowrap; }
        .audio-btn:hover { background-color: #3b82f6; }
    </style>
</head>
<body>
    <header>
        <h1><a href="/">{{ config.title }}</a></h1>
        <nav>
            {% for item in config.extra.menu %}
                <a href="{{ item.url }}">{{ item.name }}</a>
            {% endfor %}
        </nav>
        
        <div class="tools-container">
            <div class="search-box">
                <input type="search" id="search-input" placeholder="🔍 Buscar en el sitio..." autocomplete="off" enterkeyhint="search">
                <div id="search-results"></div>
            </div>
            <button class="audio-btn" onclick="leerPagina()">🔊 Escuchar</button>
        </div>
    </header>
    
    <main>
        {% block content %}{% endblock content %}
    </main>
    
    <footer>
        <p>&copy; {{ config.title }} - Todos los derechos reservados.</p>
    </footer>

    <script src="https://code.responsivevoice.org/responsivevoice.js"></script>
    <script>
        function leerPagina() {
            var texto = document.querySelector('main').innerText;
            responsiveVoice.speak(texto, "Spanish Latin American Female", { rate: 1, pitch: 1, volume: 1 });
        }
    </script>

    {% if config.build_search_index %}
    <!-- Cargamos Fuse.js desde CDN (maneja español perfectamente sin conflictos) -->
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2/dist/fuse.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('search-input');
            const results = document.getElementById('search-results');
            
            // Cargamos el índice generado por Zola en formato JSON
            fetch('/search_index.es.json')
                .then(response => response.json())
                .then(data => {
                    console.log('✅ Índice de búsqueda cargado correctamente con Fuse.js');
                    
                    // Configuramos Fuse.js para buscar en título y cuerpo
                    const fuse = new Fuse(data, {
                        keys: ['title', 'body'],
                        threshold: 0.3, // Sensibilidad de búsqueda (0.0 = exacto, 1.0 = cualquiera)
                        includeScore: true
                    });
                    
                    function performSearch() {
                        const query = input.value.trim();
                        if (query.length < 2) {
                            results.style.display = 'none';
                            return;
                        }
                        
                        const searchResults = fuse.search(query);
                        
                        if (searchResults.length > 0) {
                            // Mostramos máximo 10 resultados
                            results.innerHTML = searchResults.slice(0, 10).map(result => {
                                const doc = result.item;
                                return `<div class="search-result"><a href="${doc.url}">${doc.title}</a></div>`;
                            }).join('');
                            results.style.display = 'block';
                        } else {
                            results.innerHTML = '<div class="search-result" style="color: #666;">No se encontraron resultados</div>';
                            results.style.display = 'block';
                        }
                    }

                    input.addEventListener('input', performSearch);
                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') {
                            performSearch();
                            input.blur(); // Oculta el teclado en móviles
                        }
                    });

                    document.addEventListener('click', (e) => {
                        if (!e.target.closest('.search-box')) {
                            results.style.display = 'none';
                        }
                    });
                })
                .catch(err => {
                    console.error('Error cargando índice de búsqueda:', err);
                    input.placeholder = "⚠️ Búsqueda no disponible";
                });
        });
    </script>
    {% endif %}
</body>
</html>
