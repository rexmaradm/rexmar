<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <style>
        body { background-color: #1e3a8a; color: #ffffff; font-family: Arial, sans-serif; margin: 0; padding: 0; line-height: 1.6; }
        header { background-color: #1e40af; padding: 20px; text-align: center; border-bottom: 3px solid #3b82f6; }
        header h1 a { color: #ffffff; text-decoration: none; font-size: 2em; }
        nav { margin: 20px 0; display: flex; justify-content: center; flex-wrap: wrap; }
        nav a { color: #ffffff; text-decoration: none; margin: 5px 10px; padding: 8px 15px; background-color: #2563eb; border-radius: 5px; }
        nav a:hover { background-color: #3b82f6; }
        main { max-width: 1200px; margin: 40px auto; padding: 20px; background-color: #1e40af; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        a { color: #93c5fd; }
        .home-content { margin-bottom: 40px; border-bottom: 1px solid #3b82f6; padding-bottom: 20px; }
        .article-list { margin-top: 40px; }
        .article-list h2 { border-bottom: 2px solid #3b82f6; padding-bottom: 10px; color: #bfdbfe; }
        article.preview { margin-bottom: 15px; padding: 15px; background-color: #2563eb; border-radius: 8px; }
        article.preview h3 { margin: 0 0 5px 0; }
        article.preview a { color: #ffffff; text-decoration: none; }
        article.preview a:hover { text-decoration: underline; }
        footer { text-align: center; padding: 20px; color: #93c5fd; margin-top: 40px; }

        /* Estilos para el Buscador y el Botón de Audio */
        .tools-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin: 20px 0;
            padding: 15px;
            background-color: #2563eb;
            border-radius: 8px;
        }
        .search-form { display: flex; gap: 5px; }
        .search-form input[type="text"] {
            padding: 8px 12px;
            border: 2px solid #3b82f6;
            border-radius: 5px;
            background-color: #ffffff;
            color: #1e3a8a;
            font-size: 16px;
        }
        .search-form button, .audio-btn {
            padding: 8px 15px;
            background-color: #1e40af;
            color: #ffffff;
            border: 2px solid #3b82f6;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .search-form button:hover, .audio-btn:hover { background-color: #3b82f6; }
    </style>
</head>
<body>
    <header>
        <h1><a href="/">{{ config.title }}</a></h1>
        <nav>
            {% for item in config.extra.menu %}
                <a href="{{ item.url }}">{{ item.name }}</a>
            {% endfor %}
        </nav>
        
        <!-- Contenedor de Herramientas: Buscador y Audio -->
        <div class="tools-container">
            <!-- Buscador de Google -->
            <form class="search-form" action="https://www.google.com/search" method="get" target="_blank">
                <input type="text" name="q" placeholder="Buscar en Rexmar..." required>
                <input type="hidden" name="sitesearch" value="rexmar.pages.dev">
                <button type="submit"> Buscar</button>
            </form>

            <!-- Botón ResponsiveVoice -->
            <button class="audio-btn" onclick="leerPagina()">🔊 Escuchar página</button>
        </div>
    </header>
    
    <main>
        {% block content %}{% endblock content %}
    </main>
    
    <footer>
        <p>&copy; {{ config.title }} - Todos los derechos reservados.</p>
    </footer>

    <!-- Script de ResponsiveVoice -->
    <script src="https://code.responsivevoice.org/responsivevoice.js"></script>
    <script>
        function leerPagina() {
            // Obtiene todo el texto dentro de la etiqueta <main>
            var texto = document.querySelector('main').innerText;
            // Lo lee en español latinoamericano femenino
            responsiveVoice.speak(texto, "Spanish Latin American Female", {
                rate: 1,
                pitch: 1,
                volume: 1
            });
        }
    </script>
</body>
</html>
