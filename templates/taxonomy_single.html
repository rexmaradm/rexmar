{% extends "base.html" %}

{% block content %}
<h1>Artículos sobre: {{ term.name }}</h1>
<ul>
  {% for page in term.pages %}
    <li>
      <a href="{{ page.permalink }}">{{ page.title }}</a>
      {% if page.description %}<p>{{ page.description }}</p>{% endif %}
    </li>
  {% endfor %}
</ul>
{% endblock content %}
