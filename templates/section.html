{% extends "base.html" %}

{% block title %}{{ section.title }} - {{ config.title }}{% endblock title %}

{% block content %}
<h1>{{ section.title }}</h1>
{% for page in section.pages %}
<article>
    <h3><a href="{{ page.permalink }}">{{ page.title }}</a></h3>
    <time>{{ page.date | date(format="%Y-%m-%d") }}</time>
</article>
{% endfor %}
{% endblock content %}
